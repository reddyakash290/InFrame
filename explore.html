<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore — Frame Discovery</title>
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components/nav.css">
    <link rel="stylesheet" href="css/components/hud.css">
    <link rel="stylesheet" href="css/pages/explore.css">
</head>
<body>

    <!-- Dynamic Navigation -->
    <div id="nav-placeholder"></div>

    <!-- EXPLORE HUD -->
    <header class="explore-hud">
        <div class="hud-container">
            <div class="filter-track" id="filterTrack">
                <button class="filter-pill active">For You</button>
                <button class="filter-pill">Trending</button>
                <button class="filter-pill">Cinematography</button>
                <button class="filter-pill">Sound Design</button>
                <button class="filter-pill">Directors</button>
                <button class="filter-pill">Editors</button>
                <button class="filter-pill">Colorists</button>
                <button class="filter-pill">VFX Artists</button>
            </div>
        </div>
    </header>

    <main class="explore-universe" id="exploreUniverse">
        <div class="portfolio-container">
            <header class="portfolio-header">
                <h1 class="syne">Explore Universe</h1>
                <p>Discover creative work from across the global network, beyond your connections.</p>
            </header>

            <div class="grid-3d">
                <!-- Row 1 -->
                <div class="portfolio-item zero-g-item">
                    <div class="item-inner">
                        <div class="item-visual v1">🎬</div>
                        <div class="item-info">
                            <div class="item-meta">
                                <h3>Salt Farmers</h3>
                                <span>Documentary</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="portfolio-item zero-g-item">
                    <div class="item-inner">
                        <div class="item-visual v2">📷</div>
                        <div class="item-info">
                            <div class="item-meta">
                                <h3>Monsoon Letters</h3>
                                <span>Photography</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="portfolio-item zero-g-item">
                    <div class="item-inner">
                        <div class="item-visual v3">🎞️</div>
                        <div class="item-info">
                            <div class="item-meta">
                                <h3>Slow Burn</h3>
                                <span>Music Video</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="portfolio-item zero-g-item">
                    <div class="item-inner">
                        <div class="item-visual v4">🌿</div>
                        <div class="item-info">
                            <div class="item-meta">
                                <h3>Rooted</h3>
                                <span>Commercial</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="portfolio-item zero-g-item">
                    <div class="item-inner">
                        <div class="item-visual v5">🎭</div>
                        <div class="item-info">
                            <div class="item-meta">
                                <h3>Still Water</h3>
                                <span>Short Film</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="portfolio-item zero-g-item">
                    <div class="item-inner">
                        <div class="item-visual v1">✨</div>
                        <div class="item-info">
                            <div class="item-meta">
                                <h3>Afterlight</h3>
                                <span>Art Direction</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/components.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/hud.js"></script>
</body>
</html>
